name: Uptime Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kino-uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sitzplatzreservierung prüfen und Heartbeat an Uptime Kuma senden
        env:
          KUMA_PUSH_URL: ${{ secrets.KUMA_PUSH_URL }}
        run: python monitor.py --once
