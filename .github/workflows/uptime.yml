name: Uptime Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kino-uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sitzplatzreservierung prüfen und Heartbeat an Uptime Kuma senden
        env:
          KUMA_PUSH_URL: ${{ secrets.KUMA_PUSH_URL }}
        run: python monitor.py --once --lite

      # Läuft auch, wenn der Check oben wegen eines DOWN mit Exit-Code 1
      # fehlgeschlagen ist (if: always) - der Zustandswechsel zurück auf
      # "Vollcheck" muss trotzdem gespeichert werden. Committet nur, wenn
      # sich lite_state.json tatsächlich geändert hat (Moduswechsel), im
      # Normalfall (Lite-Modus bleibt UP) gibt es also keinen Commit.
      - name: Lite-Modus-Status committen, falls geändert
        if: always()
        run: |
          if ! git diff --quiet -- lite_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lite_state.json
            git commit -m "Update lite-mode state"
            git push
          fi
